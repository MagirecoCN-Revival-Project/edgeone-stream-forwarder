<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网关探针</title>
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="description" content="EdgeOne /stream/ 转发网关探针。看到这个页面说明网关域名网络通畅。">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0f172a; color: #e2e8f0; padding: 24px;
  }
  main {
    max-width: 480px; width: 100%;
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  h1 { font-size: 22px; letter-spacing: .5px; margin-bottom: 8px; }
  h1 code { color: #7dd3fc; font-size: .85em; }
  .ok { color: #4ade80; font-weight: 600; margin-bottom: 16px; }
  .card { border-top: 1px solid #334155; padding-top: 12px; margin-top: 4px; }
  .card div { margin-bottom: 6px; font-size: 14px; }
  .lbl { color: #94a3b8; margin-right: 8px; }
  #fn, #latency { font-variant-numeric: tabular-nums; font-weight: 600; }
  .fine { color: #4ade80; } .slow { color: #fbbf24; } .bad { color: #f87171; }
  footer { margin-top: 16px; font-size: 12px; color: #64748b; }
</style>
</head>
<body>
<main>
  <h1>网关探针 · <code id="host">…</code></h1>
  <p class="ok">✓ 页面在线。看到这个页面说明网关域名网络通畅。</p>
  <div class="card">
    <div><span class="lbl">网关函数</span><span id="fn">检测中…</span></div>
    <div><span class="lbl">函数延迟</span><span id="latency">—</span></div>
  </div>
  <footer>本页不参与搜索引擎收录。网关端点：/stream/&lt;host&gt;/&lt;path&gt;</footer>
</main>
<script>
  // 探针网关函数：请求一个白名单外的 host（probe.invalid 是虚构域名，必被拒）。
  // 函数应返回 403 + "forbidden"；静态服务器不会路由 /stream/，所以 403 只能来自
  // 函数本身 → 证明函数已部署、白名单在拦。
  // 注意：PROXY_WHITELIST 未配置时函数 fail-closed 也会 403——本页只证明"函数在跑"，
  // 白名单值对不对另用 curl 自测（见 README）。
  document.getElementById('host').textContent = location.hostname;
  var start = performance.now();
  fetch('/stream/probe.invalid/__gateway_probe', { cache: 'no-store' })
    .then(function (r) {
      var ms = (performance.now() - start).toFixed(0);
      var lat = document.getElementById('latency');
      lat.textContent = ms + 'ms';
      lat.className = ms > 800 ? 'slow' : 'fine';
      var fn = document.getElementById('fn');
      if (r.status === 403) {
        return r.text().then(function (t) {
          fn.textContent = t.indexOf('forbidden') !== -1
            ? '✓ 在线（函数已部署，白名单拦截生效）'
            : '⚠ 返回 403 但响应体异常';
          fn.className = t.indexOf('forbidden') !== -1 ? 'fine' : 'slow';
        });
      }
      if (r.status === 404) {
        fn.textContent = '✗ 函数未部署（/stream/ 无路由）';
        fn.className = 'bad';
        return;
      }
      fn.textContent = '⚠ 函数返回 ' + r.status + '（预期 403）';
      fn.className = 'slow';
    })
    .catch(function () {
      var fn = document.getElementById('fn');
      fn.textContent = '✗ 函数不可达';
      fn.className = 'bad';
    });
</script>
</body>
</html>
